<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sam Beach</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .home {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding: 48px 0;
    }
    .home h1 { font-size: 34px; }
    .home .back {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--muted);
      text-decoration: none;
      padding: 9px 18px;
      border: 1px solid var(--inputbd);
      border-radius: 7px;
      background: var(--inputbg);
      transition: border-color .15s, color .15s;
    }
    .home .back:hover { border-color: var(--accent); color: var(--ink); }
  </style>
</head>
<body>
  <main class="wrap home">
    <p class="eyebrow">beachbio.io · dashboard</p>
    <h1>Coming soon</h1>
    <p class="sub" style="margin:0">This page is under construction.</p>
    <a class="back" href="/">← home</a>
  </main>
</body>
</html>
